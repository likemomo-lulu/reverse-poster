<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>李宗盛《给自己的歌》 · 星夜（404×722）</title>
<style>
  @font-face { font-family: "HandCN"; src: url("../fonts/xi-mail.ttf"); }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0d1116; }

  .poster { position: relative; width: 404px; height: 722px; overflow: hidden; isolation: isolate; }
  .canvas {
    position: absolute; top: 0; left: 0;
    width: 878px; height: 1569px;
    transform: scale(0.46014); transform-origin: 0 0;
  }

  /* 底色直接用已处理好的《星夜》底图（拉丝/调色/暗角/颗粒都已在图里，
     这里不再套滤镜，避免二次处理把笔触糊掉） */
  .bg {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill;
    /* 整张压暗一档：歌词讲"时间是贼"，冷、暗、沉；同时把白色手写体从旋涡里拎出来 */
    filter: brightness(.56) saturate(.96) contrast(1.14);
  }

  /* 文字压在星夜里，蓝色本身够深，只补一层极淡的顶暗角给正文留呼吸 */
  /* 正文后面压一团柔和暗光：星夜旋涡太密，纯描边压不住，需要一块薄的"底" */
  .shade {
    position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(76% 32% at 50% 50%, rgba(2,8,20,.64) 0%, rgba(2,8,20,.40) 56%, rgba(2,8,20,0) 80%),
      radial-gradient(118% 82% at 50% 44%, transparent 30%, rgba(2,8,18,.38) 100%);
  }

  /* ---------- 文字 ---------- */
  .stage { position: absolute; inset: 0; }
  .cn {
    position: absolute; left: 0; right: 0; text-align: center;
    font-family: "HandCN", "Hannotate SC", serif;
    color: #f2f8fd;
    line-height: 1;
    white-space: nowrap;
    text-shadow: 0 0 26px rgba(1,6,16,.78), 0 0 11px rgba(1,6,16,.66), 0 0 4px rgba(1,6,16,.42), 0 2px 18px rgba(1,8,20,.55);
    -webkit-text-stroke: .45px currentColor;
  }
  .footline {
    position: absolute;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 14px; font-weight: 600; letter-spacing: 3px;
    color: rgba(248,252,255,.92); white-space: nowrap;
    text-shadow: 0 2px 12px rgba(2,10,24,.6);
  }
</style>
</head>
<body>
<div class="poster">
<div class="canvas">

  <img class="bg" src="bg/星夜@2x.png" alt="" />
  <div class="shade"></div>

  <div class="stage">
    <div class="cn" style="top:641px; font-size:52px; letter-spacing:.05em;">想得却不可得 你奈人生何</div>
    <div class="cn" style="top:719px; font-size:52px; letter-spacing:.05em;">该舍的舍不得 只顾着跟往事瞎扯</div>
    <div class="cn" style="top:797px; font-size:52px; letter-spacing:.05em;">等你发现时间是贼了</div>
    <div class="cn" style="top:875px; font-size:52px; letter-spacing:.05em;">它早已偷光你的选择</div>
    <div class="footline" style="left:auto; right:118px; top:965px; text-align:right;">—— 李宗盛《给自己的歌》</div>
  </div>

</div>
</div>
<script>
/* 自检：把诗句的实际墨迹范围写进 title，便于命令行取值 */
window.addEventListener('load', () => {
  const k = 404/878, range = document.createRange();
  let L = 1e9, R = -1e9, T = 1e9, B = -1e9;
  document.querySelectorAll('.cn').forEach(el => {
    range.selectNodeContents(el);
    range.getClientRects().forEach(r => {
      L = Math.min(L, r.left/k); R = Math.max(R, r.right/k);
      T = Math.min(T, r.top/k);  B = Math.max(B, r.bottom/k);
    });
  });
  document.title = `ink L${L.toFixed(0)} R${R.toFixed(0)} T${T.toFixed(0)} B${B.toFixed(0)}`;
});
</script>
</body>
</html>
