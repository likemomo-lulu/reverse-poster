<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>海报工作台</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#12161c; --line:#232b36;
    --txt:#dfe9f2; --dim:#8b9cad; --acc:#ff7a45;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg); color:var(--txt);
    font-family:"PingFang SC","Helvetica Neue",Arial,sans-serif;
    font-size:13px; height:100vh; display:flex; overflow:hidden;
  }

  /* ---------- 左栏 ---------- */
  .panel{
    width:352px; flex:0 0 352px; height:100vh; overflow-y:auto;
    background:var(--panel); border-right:1px solid var(--line);
    padding:18px 18px 40px;
  }
  .panel h1{font-size:14px; font-weight:600; letter-spacing:.5px; margin-bottom:2px}
  .panel .sub{color:var(--dim); font-size:11px; margin-bottom:18px}
  .grp{margin-bottom:20px}
  .grp > label{
    display:block; color:var(--dim); font-size:11px; letter-spacing:1px;
    margin-bottom:7px; text-transform:uppercase;
  }
  .layouts{display:grid; grid-template-columns:1fr 1fr; gap:6px}
  .layouts button{
    padding:9px 6px; background:#1a2029; border:1px solid var(--line);
    color:var(--txt); border-radius:5px; cursor:pointer; font-size:12px;
    font-family:inherit; transition:.12s;
  }
  .layouts button:hover{border-color:#3a4757}
  .layouts button.on{background:#233043; border-color:var(--acc); color:#fff}
  .layouts button small{display:block; color:var(--dim); font-size:10px; margin-top:2px}
  .layouts button.on small{color:#c8b3a8}

  textarea, input[type=text], select{
    width:100%; background:#0e1319; border:1px solid var(--line);
    color:var(--txt); border-radius:5px; padding:8px 9px; font-size:12.5px;
    font-family:inherit; line-height:1.7; resize:vertical; outline:none;
  }
  textarea:focus, input[type=text]:focus, select:focus{border-color:#3a4757}
  textarea{min-height:96px}
  input:disabled, textarea:disabled{opacity:.35; cursor:not-allowed; background:#0a0f13;}

  .row{display:flex; gap:8px; align-items:center}
  .row > *{min-width:0}
  .slider{display:flex; align-items:center; gap:9px; margin-bottom:9px}
  .slider label{flex:0 0 62px; color:var(--dim); font-size:11.5px}
  .slider input[type=range]{flex:1; accent-color:var(--acc)}
  .slider var{flex:0 0 42px; text-align:right; color:var(--txt); font-style:normal; font-size:11.5px; font-variant-numeric:tabular-nums}

  .swatches{display:flex; gap:8px; align-items:center}
  .swatches input[type=color]{
    width:34px; height:30px; padding:0; border:1px solid var(--line);
    border-radius:5px; background:none; cursor:pointer;
  }
  .swatches span{color:var(--dim); font-size:11px}

  .hint{color:#6d7f90; font-size:11px; line-height:1.6; margin-top:6px}
  .sub{color:#9db0c2; font-size:12px; font-weight:600; margin:12px 0 6px}
  .sub:first-of-type{margin-top:2px}

  /* ---------- 右栏 ---------- */
  /* --k 是预览缩放比：窗口矮的时候由 fitStage() 调小，
     保证海报上下始终留白，不会顶到页面上沿 */
  .stage{
    flex:1; height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:16px; position:relative;
    padding:28px 24px 20px; overflow:hidden;
  }
  .frame{
    width:calc(404px * var(--k, .85)); height:calc(722px * var(--k, .85));
    border-radius:3px; overflow:hidden; position:relative; background:#0d1116;
    box-shadow:0 18px 60px rgba(0,0,0,.65);
  }
  /* 双缓冲：两个 iframe 叠着放。改配置时往"背面"写，
     等它 load 完再翻到正面，输入时就没有白闪和重排了 */
  .frame .pv{
    position:absolute; top:0; left:0;
    width:404px; height:722px; border:0;
    transform:scale(var(--k, .85)); transform-origin:top left;
    opacity:0; pointer-events:none;
  }
  .frame .pv.on{opacity:1}
  .actions{display:flex; gap:10px; align-items:center}
  .btn{
    padding:10px 22px; border-radius:6px; border:1px solid var(--line);
    background:#1a2029; color:var(--txt); cursor:pointer; font-size:13px;
    font-family:inherit; transition:.12s;
  }
  .btn:hover{border-color:#3a4757}
  .btn.primary{background:var(--acc); border-color:var(--acc); color:#20100a; font-weight:600}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn:disabled{opacity:.5; cursor:default}
  .status{color:var(--dim); font-size:12px; min-height:16px}
  .status.err{color:#ff6b6b}
</style>
</head>
<body>

<div class="panel">
  <h1>海报工作台</h1>
  <div class="sub">改文字 · 换版式 · 一键出 @2x</div>

  <div class="grp">
    <label>版式</label>
    <div class="layouts" id="layouts"></div>
  </div>

  <div class="grp">
    <label>底图</label>
    <div class="row" style="margin-bottom:7px">
      <input type="text" id="bgdir" placeholder="底图文件夹路径" spellcheck="false">
      <button class="btn" id="bgdirGo" style="padding:8px 12px;flex:0 0 auto">载入</button>
    </div>
    <select id="bgimg"></select>
  </div>

  <div class="grp">
    <label>字体</label>
    <div class="row">
      <input type="text" id="fontCN" list="font-list" placeholder="中文手写体">
      <input type="text" id="fontEN" list="font-list" placeholder="英文手写体">
    </div>
    <datalist id="font-list"></datalist>
    <button class="btn" id="scanFonts" style="width:100%;margin-top:7px">扫描本机字体</button>
    <div class="hint" id="fontHint">留空用内置字体；也可直接输入字体名</div>

    <div class="sub">排版</div>
    <div id="sld-type"></div>
    <div class="hint" id="fsHint"></div>
  </div>

  <div class="grp">
    <label>字体颜色</label>
    <div class="swatches">
      <input type="color" id="ink" title="文字色">
      <span>文字</span>
      <input type="color" id="accent" title="撞色">
      <span>撞色</span>
    </div>
  </div>

  <div class="grp">
    <label>文案</label>

    <div class="sub">中文（一行一句）</div>
    <textarea id="cn" spellcheck="false"></textarea>

    <div class="sub" id="enLabel">英文（可留空）</div>
    <textarea id="en" spellcheck="false"></textarea>

    <div class="row" style="margin-top:9px">
      <input type="text" id="mast" placeholder="刊头 · 顶部（可留空）">
      <input type="text" id="foot" placeholder="落款 · 底部（可留空）">
    </div>
    <div class="hint">六个版式通用：刊头贴顶、落款贴底，四边边距统一 88px；文案随意写，留空就不画。</div>

    <input type="text" id="credit" placeholder="歌词署名 · 作者 歌曲名" style="margin-top:7px">
    <div class="hint" id="creditHint">仅「歌词居中」版式使用，贴在歌词右下方：字号为歌词的 0.89 倍（署名太长会自动缩到一行放得下），上方间距随「行距」联动；和歌词一起参与居中。注意内置手写体没有破折号字形，输入 —— 会是空白。</div>
  </div>

  <div class="grp">
    <button class="btn" id="reset" style="width:100%">恢复默认</button>
    <div class="hint">配置存在浏览器本地，刷新不丢。</div>
  </div>
</div>

<div class="stage">
  <div class="frame">
    <iframe id="preview" class="pv on" title="预览"></iframe>
    <iframe id="previewB" class="pv" title="预览" aria-hidden="true" tabindex="-1"></iframe>
  </div>
  <div class="actions">
    <button class="btn primary" id="export">导出 @2x PNG</button>
    <button class="btn" id="export1x">导出 1x</button>
  </div>
  <div class="status" id="status"></div>
</div>

<script>
/* ============================================================
   常量
   ============================================================ */
const W = 878, H = 1569;

const LAYOUTS = [
  { id:'vary',    name:'居中递变', sub:'字号逐行变化' },
  { id:'vertical',name:'竖排右起', sub:'一字一列' },
  { id:'hero',    name:'巨句',     sub:'首句压满' },
  { id:'uniform', name:'居中等大', sub:'统一字号' },
  { id:'bottom',  name:'沉底等大', sub:'画面优先' },
  { id:'lyric',   name:'歌词居中', sub:'整块居中·无英文' },
];

// 接口失败时的兜底列表：assets/ 里放的是成品底图（已拉丝调色），
// 未加工的原图在 assets/原图/，不参与选图
const BG_IMAGES = [
  '草原青山.png','暖金秋叶.png','薰衣草花海.png','雨雾茶园.png','樱湖春景.png',
  '黄昏雪原.png','黑金天际线.png','麦黄田野.png','暖阳海面.png','山丘.png',
];

/* ============================================================
   滑杆参数表（单一数据源）
   默认值、面板 HTML、回填、事件绑定全部由这张表生成。
   加一个滑杆 = 这里加一行 + buildHTML 里读 cfg.xxx，不用再改 4 个地方。
   grp 对应面板分组：type=排版
   底图是成品（拉丝、色调都已在上游调好），工作台不再叠第二层处理，
   所以这里只剩排版参数。
   ============================================================ */
const SLIDERS = [
  { grp:'type',  k:'fsScale', label:'字号倍率', min:0.55, max:1.6,  step:0.01, def:1.00, unit:'×' },
  { grp:'type',  k:'ls',      label:'字距',     min:-0.05,max:0.40, step:0.01, def:0.05, unit:'em' },
  { grp:'type',  k:'lh',      label:'行距',     min:0.70, max:2.20, step:0.01, def:1.00, unit:'×' },
];

const DEFAULTS = Object.assign({
  fontCN: '', fontEN: '',
  layout:'bottom',
  cn:'',
  en:'',
  mast:'',
  foot:'',
  credit:'',
  ink:'#f2fcfd',
  accent:'#ff7a45',
  bgdir:'',            // 底图文件夹（服务端回传的绝对路径）
  bgimg:'',
}, Object.fromEntries(SLIDERS.map(p => [p.k, p.def])));   // 滑杆默认值统一来自 SLIDERS

/* ============================================================
   工具
   ============================================================ */
/** 上一次渲染的度量：base=基准字号，maxW=最宽一行占用的像素宽度，W=画幅宽 */
let METRICS = { base: 0, maxW: 0 };

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* 每个字体的实测字宽（em）。内置喜脉喜欢体实测 0.9em/字，但换成别的字体可能
   接近 1.0em——差这 10%，版式留白就会从 98px 塌到 41px。所以换字体时必须重新量。 */
const FONT_ADV = {};
let ADV = 0.9;                          // 当前生效的字宽（em/字）

/** 用 canvas 量一个字体里"国"的宽度（单位 em）。量不出来就退回内置值 0.9。 */
function measureAdvance(name){
  if (!name) return 0.9;
  if (FONT_ADV[name]) return FONT_ADV[name];
  try {
    const ctx = document.createElement('canvas').getContext('2d');
    const size = 200;
    ctx.font = size + 'px "' + String(name).replace(/["\\]/g, '') + '"';
    const w = ctx.measureText('国国国国国国国国国国').width / size / 10;
    if (w > 0.3 && w < 1.6) FONT_ADV[name] = w;
  } catch (e) { /* 量不出来就用默认值 */ }
  return FONT_ADV[name] || 0.9;
}

/** 一行文字的宽度（以 em 为单位）。

    版式是按"1em/字"标定的，而内置喜脉喜欢体实测 0.9em/字——这个偏保守的估算
    恰好留出了设计需要的边距（换成精确值反而让留白从 98px 塌到 63px）。
    所以按"相对内置字体的倍数"折算：内置字体 k=1，与既有成品逐像素一致；
    换字体时按实际字宽等比缩放，边距就能守住。
*/
function emWidth(text, ls){
  const n = [...text].length;
  return n * (ADV / 0.9) + Math.max(0, n - 1) * ls;
}

/**
 * 计算统一字号。
 * 同时受"最宽一行塞得下"和"总行数塞得下"两个约束，取较小值。
 * maxW / availH 是可用区域（设计坐标，878×1569）。
 */
function fitUniform(lines, maxW, availH, ls, lh){
  const maxEm = Math.max(1, ...lines.map(t => emWidth(t, ls)));
  const byW = maxW / maxEm;
  const byH = availH / (lines.length * lh);
  return Math.max(26, Math.min(byW, byH, 132));
}

/* 装饰层的四边安全边（设计坐标 878×1569）。
   刊头距顶 = 落款距底 = 左右边距 = DECO，四个方向共用同一个数，改一处全变。 */
const DECO = 88;

/**
 * 装饰层：顶部刊头 + 底部落款，所有版式共用。
 *
 * 为什么要用 flex 而不是固定坐标：早期版本把细线写死在 left:164 / right:164、
 * 文字固定居中在 440px，刊头文案一长就直接压在线上。现在两侧细线是 flex:1，
 * 自动吃掉剩余宽度，中间夹「圆点 + 文字」，所以文案多长都不会打架。
 *
 * 两侧线条的端点被 left/right 顶到 DECO，和落款用的是同一套边距；
 * 落款居中，中轴和人眼对齐。
 */
function decoLayer(cfg){
  const line = 'flex:1 1 auto;height:2px;background:rgba(248,253,255,.42)';
  const dot  = 'flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:rgba(248,253,255,.85)';
  let s = '';
  if (cfg.mast) {
    s += `
      <div style="position:absolute; left:${DECO}px; right:${DECO}px; top:${DECO}px;
        height:15px; display:flex; align-items:center; gap:14px;">
        <div style="${line}"></div>
        <div style="${dot}"></div>
        <div class="word" style="flex:0 0 auto">${esc(cfg.mast)}</div>
        <div style="${dot}"></div>
        <div style="${line}"></div>
      </div>`;
  }
  if (cfg.foot) {
    s += `
      <div class="footline" style="position:absolute; left:${DECO}px; right:${DECO}px;
        bottom:${DECO}px; text-align:center;">${esc(cfg.foot)}</div>`;
  }
  return s;
}

/* ============================================================
   渲染器：把配置拼成一整份独立 HTML
   ============================================================ */
function buildHTML(cfg, opts){
  opts = opts || {};
  const FS = Number(cfg.fsScale) || 1;   // 字号倍率
  METRICS = { base: 0, maxW: 0 };
  /** 记录一行文字实际占多宽，用来判断有没有冲出画幅 */
  const track = (text, ls, size) => {
    const w = emWidth(text, ls) * size;
    if (w > METRICS.maxW) METRICS.maxW = w;
    return size;
  };
  const cn = cfg.cn.split('\n').map(s => s.trim()).filter(Boolean);
  const en = cfg.en.split('\n').map(s => s.trim()).filter(Boolean);
  // 字体名要拼进 <style>，把可能破坏 CSS 的字符剔掉；FONT_ALT 里存着同一字体的
  // 另一种语言名，两个都塞进备选链，避免某个名字浏览器认不出来时静默回退
  const sanitizeFont = n => String(n || '').replace(/["<>{};\\]/g, '').trim();
  const fontStack = (name, fallback) => {
    const main = sanitizeFont(name);
    if (!main) return fallback;
    const alt = sanitizeFont(FONT_ALT[main] || '');
    return [main, alt].filter(Boolean).map(n => `"${n}"`).join(',') + ',' + fallback;
  };

  ADV = measureAdvance(cfg.fontCN);  // 换字体先量字宽，排版才不会崩

  const LS = Number(cfg.ls);        // 基准字距（em），由面板「字距」控制
  const LH = Number(cfg.lh) || 1;   // 行距倍率，乘在各版式的基准行高上（1 = 原视觉）
  if (!isFinite(LS)) throw new Error('字距参数非法：' + cfg.ls);

  /* ---------- 背景 ---------- */
  // 预览用 /bg 走 HTTP，导出用 file:// 直读磁盘——同一张图两条路都能拿到
  const bgHref = cfg.bgdir
    ? (opts.base
        ? '/bg?path=' + encodeURIComponent(cfg.bgdir + '/' + cfg.bgimg)
        : 'file://' + (cfg.bgdir + '/' + cfg.bgimg).split('/').map(encodeURIComponent).join('/'))
    : 'assets/' + cfg.bgimg;

  // 底图在上游已经是成品（拉丝、预饱和、色调都调好了），这里原样铺满。
  // 再叠一层滤镜就会「二次处理」——笔触变糊、颜色发闷，所以这里什么都不加。
  const bgSVG = `<img class="bg" src="${bgHref}" alt="">`;

  /* ---------- 文字层 ---------- */
  let stage = '';

  if (cfg.layout === 'vertical') {
    // 竖排：一句一列，从右往左
    const LSv = LS + 0.05;              // 竖排比横排松一点，和原视觉一致
    const right0 = 118;                 // 最右一列的右边缘位置
    const maxLen = Math.max(1, ...cn.map(t => [...t].length));
    // 一列的总高 = 字数 × 字号 + 字间空隙，字距变了高度也得跟着变，否则会冲出画幅
    const colFactor = 1 + LSv * (maxLen - 1) / maxLen;
    const fs = Math.max(30, Math.min((H - 620) / (maxLen * colFactor), 118)) * FS;
    const colGap = fs * 1.42 * LH;
    METRICS.base = fs;
    // 竖排的约束在横向：最左一列的左边缘不能跑出画幅
    METRICS.maxW = right0 + (cn.length - 1) * colGap + fs;
    const top0 = Math.max(300, (H - maxLen * fs * colFactor) / 2);
    stage += cn.map((t, i) => `
      <div class="cn" style="position:absolute; writing-mode:vertical-rl; text-orientation:upright;
        right:${right0 + i * colGap}px; top:${top0}px; font-size:${fs}px; letter-spacing:${LSv}em;">${esc(t)}</div>`).join('');
    if (en.length) {
      // 英文也竖排：一列一句，放最左侧，避免压住中文字列
      en.forEach((t, i) => {
        stage += `
      <div class="en" style="position:absolute; left:${24 + i * 52}px; top:${top0}px;
        font-size:38px; letter-spacing:.05em; transform:rotate(90deg); transform-origin:0 0;">${esc(t)}</div>`;
      });
    }

  } else if (cfg.layout === 'hero') {
    // 巨句：首句压满宽度，其余缩小居中；整块垂直居中
    const head = cn[0] || '';
    const rest = cn.slice(1);
    const LShead = LS - 0.03;           // 巨句首句收紧，避免压满时太散
    const fs1 = Math.min((W - 120) / emWidth(head, LShead), 172) * FS;
    const fs2 = Math.max(34, fs1 * 0.5);
    METRICS.base = fs1;
    track(head, LShead, fs1);
    const lh1 = fs1 * 1.05 * LH;
    const lh2 = fs2 * 1.28 * LH;
    const gapRule = 46;        // 首句到细线
    const gapAfter = 92;       // 细线到副句
    const enBlock = en.length ? 30 + 46 * 1.2 : 0;

    const totalH = lh1 + gapRule + gapAfter + rest.length * lh2 + enBlock;
    let y = Math.max(120, (H - totalH) / 2);

    stage += `
      <div class="cn" style="position:absolute; left:0; right:0; text-align:center;
        top:${y}px; font-size:${fs1}px; letter-spacing:${LShead}em;">${esc(head)}</div>`;
    y += lh1 + gapRule;
    stage += `<div style="position:absolute; left:60px; top:${y}px; width:${W - 120}px; height:1px;
                    background:rgba(248,253,255,.46);"></div>`;
    y += gapAfter;

    rest.forEach(t => {
      stage += `
      <div class="cn" style="position:absolute; left:0; right:0; text-align:center;
        top:${y}px; font-size:${fs2}px; letter-spacing:${LS}em;">${esc(t)}</div>`;
      y += lh2;
    });

    if (en.length) {
      stage += `
      <div class="en" style="position:absolute; left:0; right:0; text-align:center;
        top:${y + 30}px; font-size:46px; letter-spacing:.04em;">${esc(en.join(' '))}</div>`;
    }

  } else if (cfg.layout === 'uniform' || cfg.layout === 'bottom') {
    // 等大：统一字号，水平居中
    const isBottom = cfg.layout === 'bottom';
    const availH = isBottom ? 730 : 1000;
    const fs = fitUniform(cn, W - 140, availH, LS, 1.5 * LH) * FS;
    METRICS.base = fs;
    cn.forEach(t => track(t, LS, fs));
    const lh = fs * 1.5 * LH;
    const blockH = cn.length * lh;

    let top;
    let ruleY = 0;
    if (isBottom) {
      const bottom = 250;
      top = H - bottom - blockH;
      ruleY = top - 46;
      stage += `<div style="position:absolute; left:60px; top:${ruleY}px; width:${W - 120}px;
                             height:1px; background:rgba(248,253,255,.46);"></div>`;
    } else {
      top = (H - blockH) / 2;
    }

    // 居中排版后文字常常落在画面亮部，光晕要比其它版式重一档才压得住
    const HALO = 'text-shadow:0 0 20px rgba(4,16,30,.55),0 0 8px rgba(4,16,30,.45),' +
                 '0 2px 14px rgba(3,18,34,.42);';
    stage += cn.map((t, i) => `
      <div class="cn" style="position:absolute; left:0; right:0; text-align:center;
        top:${top + i * lh}px; font-size:${fs}px; letter-spacing:${LS}em;${HALO}">${esc(t)}</div>`).join('');

  } else if (cfg.layout === 'lyric') {
    // 歌词居中：整块水平+垂直居中，不排英文；署名跟在末行右下侧
    // 留白按"墨迹"算而不是按行盒：末行只占一个字高，行盒里多出来的空白不该算进去
    const fs = fitUniform(cn, W - 90, 1000, LS, 1.5 * LH) * FS;
    METRICS.base = fs;
    cn.forEach(t => track(t, LS, fs));
    const lh = fs * 1.5 * LH;
    const inkH = (cn.length - 1) * lh + fs;

    // 署名是歌词块的一部分：它占的高度也要算进居中，
    // 否则只居中歌词、署名往下挂，整块看起来是偏下的
    const credit = (cfg.credit || '').trim();

    // 右端锚点：贴齐最长一行右缘（歌词整块居中，右缘 = 画幅中心 + 最宽一行的一半）
    const creditRightPad = Math.max(20, (W - METRICS.maxW) / 2);

    // 署名两个尺寸都按比例算，不写死像素：
    //   字号 = 歌词字号 × 0.89
    //   间距 = 行高 lh × 0.6 —— 行距拉大时署名跟着往下让
    // 但署名通常比歌词长（「—— 李宗盛《给自己的歌》」13 个字 vs 歌词最长 6 个字），
    // 一行放不下时 text-align:right 会失效、文字从左边开始往右溢，看起来就成了"左对齐"。
    // 所以按「右边距 + 左侧 60 安全边」反算字号上限，超了就等比缩，保证整行塞得下。
    let cfs = Math.max(12, fs * 0.89);
    if (credit) {
      const fitW = W - creditRightPad - 60;
      cfs = Math.max(12, Math.min(cfs, fitW / emWidth(credit, 0)));
    }
    const CREDIT_GAP = lh * 0.6;
    const creditH = credit ? CREDIT_GAP + cfs : 0;
    const top = (H - (inkH + creditH)) / 2;

    // 居中排版后文字常常落在画面亮部，光晕要比其它版式重一档才压得住
    const HALO = 'text-shadow:0 0 20px rgba(4,16,30,.55),0 0 8px rgba(4,16,30,.45),' +
                 '0 2px 14px rgba(3,18,34,.42);';
    stage += cn.map((t, i) => `
      <div class="cn" style="position:absolute; left:0; right:0; text-align:center;
        top:${top + i * lh}px; font-size:${fs}px; letter-spacing:${LS}em;${HALO}">${esc(t)}</div>`).join('');

    // 署名：独立字段，右端对齐到最长一行，挂在歌词下方
    if (credit) {
      // left:0 + right:X + text-align:right：盒子铺满到右边距、文字贴右；
      // 字号已在上面按可用宽度收窄，不会再溢出（溢出时右对齐会失效）
      stage += `<div class="credit" style="position:absolute; left:0; right:${creditRightPad.toFixed(1)}px;
        top:${(top + inkH + CREDIT_GAP).toFixed(1)}px; font-size:${cfs.toFixed(1)}px;
        text-align:right;${HALO}">${esc(credit)}</div>`;
    }

  } else {
    // vary：字号逐行递变 + 居中
    const scale = [1, 0.86, 0.94, 0.90, 0.96, 0.88];
    const LS_OFF = [0.05, 0.07, -0.03, 0.01, -0.07];   // 相对基准字距的偏移
    const totalScale = cn.reduce((a, _, i) => a + scale[i % scale.length], 0);
    const maxLineEm = Math.max(1, ...cn.map(t => emWidth(t, LS + 0.07)));
    const fs = Math.max(28, Math.min((W - 150) / maxLineEm, 1000 / (totalScale * 1.36 * LH), 132)) * FS;
    METRICS.base = fs;
    cn.forEach((t, i) => track(t, LS + 0.07, fs * scale[i % scale.length]));
    const lh = fs * 1.36 * LH;
    const blockH = totalScale * lh;
    let y = (H - blockH) / 2;

    if (en.length) {
      const half = Math.ceil(en.length / 2);
      en.slice(0, half).forEach((t, i) => {
        stage += `<div class="en" style="position:absolute; left:0; right:0; text-align:center;
          top:${240 + i * 56}px; font-size:48px; letter-spacing:.05em;">${esc(t)}</div>`;
      });
      en.slice(half).forEach((t, i) => {
        stage += `<div class="en" style="position:absolute; left:0; right:0; text-align:center;
          top:${H - 300 + i * 54}px; font-size:48px; letter-spacing:.05em;">${esc(t)}</div>`;
      });
    }

    cn.forEach((t, i) => {
      const s = fs * scale[i % scale.length];
      const ls = LS + LS_OFF[i % 5];
      stage += `<div class="cn" style="position:absolute; left:0; right:0; text-align:center;
        top:${y}px; font-size:${s}px; letter-spacing:${ls}em;">${esc(t)}</div>`;
      y += scale[i % scale.length] * lh;
    });

  }

  /* 装饰层：六个版式共用同一套刊头 / 落款 */
  stage += decoLayer(cfg);

  /* ---------- 完整 HTML ---------- */
  const base = opts.base ? `<base href="${opts.base}">` : '';

  return `<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">${base}
<style>
  @font-face{font-family:"HandCN"; src:url("fonts/xi-mail.ttf");}
  @font-face{font-family:"HandEN"; src:url("fonts/caveat-400.woff2");}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#0d1116;width:404px;height:722px;overflow:hidden}
  .poster{position:relative;width:404px;height:722px;overflow:hidden;isolation:isolate}
  .canvas{position:absolute;top:0;left:0;width:${W}px;height:${H}px;transform:scale(${(404/W).toFixed(5)});transform-origin:0 0}
  .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .cn{font-family:${fontStack(cfg.fontCN, '"HandCN","Hannotate SC",serif')};color:${cfg.ink};line-height:1;
      white-space:nowrap;text-shadow:0 2px 14px rgba(3,22,38,.26);-webkit-text-stroke:.45px currentColor;}
  .credit{font-family:${fontStack(cfg.fontCN, '"HandCN","Hannotate SC",serif')};color:${cfg.ink};
      line-height:1;white-space:nowrap;text-align:right;opacity:.9;}
  .en{font-family:${fontStack(cfg.fontEN, '"HandEN","Bradley Hand",cursive')};color:${cfg.accent};line-height:.95;
      white-space:nowrap;text-shadow:0 2px 10px rgba(0,20,30,.36);}
  .word{font-family:"Helvetica Neue",Arial,sans-serif;font-size:15px;font-weight:600;
      letter-spacing:5px;color:rgba(248,253,255,.93);white-space:nowrap;}
  .footline{font-family:"Helvetica Neue",Arial,sans-serif;font-size:14px;font-weight:600;
      letter-spacing:3px;color:rgba(248,253,255,.88);white-space:nowrap;}
  textarea:disabled{opacity:.42;cursor:not-allowed;}
</style></head>
<body><div class="poster"><div class="canvas">
${bgSVG}
${stage}
</div></div></body></html>`;
}

/* ============================================================
   界面
   ============================================================ */
const $ = id => document.getElementById(id);
const KEY = 'poster-workbench-v2';

/**
 * 预览缩放：海报是 404×722，窗口矮的时候按比例缩小，
 * 保证上下留白（不缩小的话 flex 居中会把海报顶出可视区上沿）。
 * 预留高度 = 上下 padding 48 + 两个 gap 32 + 按钮行 44 + 状态行 20 ≈ 144，取 170 留余量。
 */
function fitStage(){
  const avail = window.innerHeight - 170;
  const k = Math.max(0.45, Math.min(0.85, avail / 722));
  document.documentElement.style.setProperty('--k', k.toFixed(4));
}
fitStage();
window.addEventListener('resize', fitStage);

/** 数值显示：去掉多余小数尾巴（1.30 → 1.3，52.0 → 52） */
const fmtV = v => String(Math.round(Number(v) * 1000) / 1000);

// 面板里的滑杆由 SLIDERS 生成，加参数不用再手写 HTML
['type'].forEach(g => {
  const box = $('sld-' + g);
  if (!box) return;
  box.innerHTML = SLIDERS.filter(p => p.grp === g).map(p => `
    <div class="slider">
      <label>${p.label}</label>
      <input type="range" id="${p.k}" min="${p.min}" max="${p.max}" step="${p.step}">
      <var id="${p.k}V"></var>
    </div>`).join('');
});

let state = Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem(KEY) || '{}'));

// 支持 ?layout=vertical 这类直链，方便分享和逐版验收
const urlLayout = new URLSearchParams(location.search).get('layout');
if (urlLayout && LAYOUTS.some(l => l.id === urlLayout)) state.layout = urlLayout;

// 版式按钮
$('layouts').innerHTML = LAYOUTS.map(l =>
  `<button data-layout="${l.id}">${l.name}<small>${l.sub}</small></button>`).join('');
let BG_LIST = BG_IMAGES.slice();   // 当前文件夹里的图片；接口失败时退回内置列表

function fillBgSelect(){
  $('bgimg').innerHTML = BG_LIST.map(f =>
    `<option value="${esc(f)}">${esc(f.replace(/\.[^.]+$/, ''))}</option>`).join('');
  if (!BG_LIST.includes(state.bgimg) && BG_LIST.length) state.bgimg = BG_LIST[0];
  if (BG_LIST.length) $('bgimg').value = state.bgimg;
}

/** 载入一个文件夹下的图片；失败就退回内置 assets 列表，保证还能用 */
async function loadDir(dir){
  $('bgdir').value = dir;
  try {
    const res = await fetch('/api/images?dir=' + encodeURIComponent(dir));
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || ('HTTP ' + res.status));
    if (!data.files.length) throw new Error('这个文件夹里没有图片');
    state.bgdir = data.dir;
    BG_LIST = data.files;
    if (!BG_LIST.includes(state.bgimg)) state.bgimg = BG_LIST[0];
    $('status').className = 'status';
    $('status').textContent = `已载入 ${data.files.length} 张 · ${data.dir.replace(/^.*\//, '')}`;
  } catch (e) {
    state.bgdir = '';
    BG_LIST = BG_IMAGES.slice();
    if (!BG_LIST.includes(state.bgimg)) state.bgimg = BG_LIST[0];
    $('status').className = 'status err';
    $('status').textContent = '读取文件夹失败：' + e.message;
  }
  fillBgSelect();
  paint();
}

function syncUI(){
  document.querySelectorAll('#layouts button').forEach(b =>
    b.classList.toggle('on', b.dataset.layout === state.layout));
  $('cn').value = state.cn;
  $('en').value = state.en;
  // 歌词居中版式不排英文，把输入框禁掉，避免改了没反应
  const noEN = state.layout === 'lyric';
  $('en').disabled = noEN;
  $('enLabel').textContent = noEN ? '英文（此版式不排英文）' : '英文（可留空）';
  $('mast').value = state.mast;
  $('foot').value = state.foot;
  $('credit').value = state.credit || '';
  // 署名只有「歌词居中」用得上；刊头/落款两种版式都能用（歌词版式靠它撑上下画框）
  $('credit').disabled = !noEN;
  $('fontCN').value = state.fontCN || '';
  $('fontEN').value = state.fontEN || '';
  $('ink').value = state.ink;
  $('accent').value = state.accent;
  fillBgSelect();
  SLIDERS.forEach(p => {
    $(p.k).value = state[p.k];
    $(p.k + 'V').textContent = fmtV(state[p.k]) + p.unit;
  });
}

let timer = null;
function scheduleRender(){
  clearTimeout(timer);
  timer = setTimeout(paint, 110);
}

const SAFE = 30;      // 画幅安全边：文字离边 30px 以内算压线
const MAX_TRIES = 3;  // 自动收窄最多重试次数，防止死循环

let effScale = 1;     // 实际用于渲染的倍率（可能被自动收窄）
let tries = 0;

function paint(){
  localStorage.setItem(KEY, JSON.stringify(state));
  effScale = state.fsScale;
  tries = 0;
  build();
}

/* 双缓冲：FRAMES[cur] 是在正面显示的，另一个在背面。
   每次都把新 HTML 写进背面，加载完再整帧翻上来——
   这样输入不会白闪、不会重排，自动收窄连跑三次也看不出来。 */
const FRAMES = [$('preview'), $('previewB')];
let cur = 0;
let seq = 0;    // 每次 build 自增；只有"最新序号"的加载才允许翻面

function build(){
  const cfg = Object.assign({}, state, { fsScale: effScale });
  const back = FRAMES[1 - cur];
  seq += 1;
  // 在 <head> 里打一个序号戳：加载完成时比对，过期的加载直接丢弃。
  // 否则快速输入时，旧帧的 load 会先把面翻过去，新内容就再也上不来了。
  back.srcdoc = buildHTML(cfg, { base: '/' })
    .replace('<head>', `<head><meta name="wb-seq" content="${seq}">`);
}

function flip(){
  FRAMES[cur].classList.remove('on');
  cur = 1 - cur;
  FRAMES[cur].classList.add('on');
}

/**
 * 预览加载完后实测每一行文字的边界。
 * 为什么不能靠算：emWidth 假设每个汉字正好 1em，但手写体的实际字宽不是 1em，
 * 按估算收窄仍会轻微出画。这里直接量 DOM，拿到真实包围盒。
 */
FRAMES.forEach(frame => frame.addEventListener('load', () => {
  const doc = frame.contentDocument;
  if (!doc) return;
  const stamp = doc.querySelector('meta[name="wb-seq"]');
  if (!stamp || Number(stamp.content) !== seq) return;   // 空白帧 / 过期加载

  const k = 404 / W;                 // 画布缩放比，把 CSS px 换算回设计坐标
  let left = Infinity, right = -Infinity, top = Infinity, bottom = -Infinity;

  // 注意：.cn 是 left:0;right:0 的整宽容器，直接量会永远等于画幅宽。
  // 必须用 Range 量文字本身的紧包围盒。
  const range = doc.createRange();
  doc.querySelectorAll('.cn, .en').forEach(el => {
    if (!el.textContent.trim()) return;
    range.selectNodeContents(el);
    const rects = range.getClientRects();
    const list = rects.length ? Array.from(rects) : [el.getBoundingClientRect()];
    list.forEach(r => {
      if (!r.width && !r.height) return;
      left   = Math.min(left,   r.left   / k);
      right  = Math.max(right,  r.right  / k);
      top    = Math.min(top,    r.top    / k);
      bottom = Math.max(bottom, r.bottom / k);
    });
  });

  if (left === Infinity) { $('fsHint').textContent = '暂无文案'; flip(); return; }

  // 横向、纵向任一越界都要收
  const overW = Math.max(right - (W - SAFE), SAFE - left, 0);
  const overH = Math.max(bottom - (H - SAFE), SAFE - top, 0);
  const over  = Math.max(overW / (W - SAFE * 2), overH / (H - SAFE * 2));

  if (over > 0.002 && tries < MAX_TRIES) {
    tries++;
    effScale *= 1 - over;
    build();
    return;
  }

  const base = Math.round(METRICS.base);
  if (Math.abs(effScale - state.fsScale) > 0.005) {
    $('fsHint').textContent =
      `基准 ${base}px · 已自动收窄到 ${effScale.toFixed(2)}×（画幅上限）`;
    $('fsHint').style.color = '#ffb28f';
  } else {
    $('fsHint').textContent =
      `基准 ${base}px · 最宽一行 ${Math.round(right - left)}px`;
    $('fsHint').style.color = '';
  }
  flip();                            // 背面画好了，整帧翻到正面
}));

/* ---------- 绑定 ---------- */
$('layouts').addEventListener('click', e => {
  const btn = e.target.closest('button[data-layout]');
  if (!btn) return;
  state.layout = btn.dataset.layout;
  syncUI(); paint();
});

/* ---------- 本机字体 ---------- */
// 浏览器不让网页枚举系统字体，列表由本地服务读字体文件的 name 表给出。
// FONT_ALT 记住"另一个语言的名字"，渲染时一起放进 font-family 备选链。
const FONT_ALT = {};
async function loadFonts(){
  const hint = $('fontHint');
  hint.textContent = '正在扫描…';
  try {
    const r = await fetch('/api/fonts');
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || '扫描失败');
    const dl = $('font-list');
    dl.innerHTML = '';
    d.fonts.forEach(f => {
      if (f.alt) FONT_ALT[f.name] = f.alt;
      const o = document.createElement('option');
      o.value = f.name;
      if (f.alt) o.label = f.alt;
      dl.appendChild(o);
    });
    const cn = d.fonts.filter(f => /[\u4e00-\u9fff]/.test(f.name)).length;
    hint.textContent = `已扫描 ${d.total} 个字体（含中文名 ${cn} 个）`;
  } catch (e) {
    hint.textContent = '扫描失败：' + e.message;
  }
}
$('scanFonts').addEventListener('click', loadFonts);

[['fontCN','fontCN'],['fontEN','fontEN']].forEach(([id, key]) => {
  $(id).addEventListener('input', () => { state[key] = $(id).value.trim(); paint(); });
});

[['cn','cn'],['en','en'],['mast','mast'],['foot','foot'],['credit','credit']].forEach(([id, key]) => {
  $(id).addEventListener('input', e => {
    state[key] = e.target.value;
    // 文案改动只重绘，不回写输入框，避免光标跳动
    localStorage.setItem(KEY, JSON.stringify(state));
    scheduleRender();
  });
});

[['ink','ink'],['accent','accent']].forEach(([id, key]) => {
  $(id).addEventListener('input', e => { state[key] = e.target.value; scheduleRender(); });
});

$('bgimg').addEventListener('change', e => { state.bgimg = e.target.value; paint(); });
$('bgdirGo').addEventListener('click', () => loadDir($('bgdir').value.trim() || 'assets'));
$('bgdir').addEventListener('keydown', e => {
  if (e.key === 'Enter') loadDir($('bgdir').value.trim() || 'assets');
});

SLIDERS.forEach(p => {
  $(p.k).addEventListener('input', e => {
    state[p.k] = parseFloat(e.target.value);
    $(p.k + 'V').textContent = fmtV(state[p.k]) + p.unit;
    scheduleRender();
  });
});

$('reset').addEventListener('click', () => {
  state = Object.assign({}, DEFAULTS);
  syncUI(); paint();
});

/* ---------- 导出 ---------- */
async function doExport(scale){
  const status = $('status');
  status.className = 'status';
  status.textContent = '渲染中…';
  $('export').disabled = $('export1x').disabled = true;

  try {
    // 必须用收窄后的倍率，否则预览不越界、导出却出画
    const html = buildHTML(Object.assign({}, state, { fsScale: effScale }), {});
    const res = await fetch('/render', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ html, scale }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({ error: 'HTTP ' + res.status }));
      throw new Error(err.error || '渲染失败');
    }
    const blob = await res.blob();
    const ts = new Date().toISOString().slice(0, 16).replace(/[-:T]/g, '');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `poster-${state.layout}-${ts}${scale === 2 ? '@2x' : ''}.png`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    status.textContent = '已导出（' + (404 * scale) + '×' + (722 * scale) + '）';
  } catch (err) {
    status.className = 'status err';
    status.textContent = '导出失败：' + err.message;
  } finally {
    $('export').disabled = $('export1x').disabled = false;
  }
}

$('export').addEventListener('click', () => doExport(2));
$('export1x').addEventListener('click', () => doExport(1));

/* ---------- 启动 ---------- */
syncUI();
loadFonts();                      // 首次打开自动扫一次，下拉框直接可用
loadDir(state.bgdir || 'assets');
</script>
</body>
</html>
